---
- name: Create a security policy on Palo Alto Firewall
  hosts: localhost
  gather_facts: no
  collections:
    - paloaltonetworks.panos

  tasks:
    - name: Create security policy rule
      paloaltonetworks.panos.panos_security_rule:
        provider:
          ip_address: "192.168.29.55"
          username: "admin"
          password: "P@ssw0rd"
        rule_name: "AllowSSH"
        source_zone: "any"
        destination_zone: "any"
        source_ip: "any"
        destination_ip: "any"
        application: "ssh"
        service: "application-default"
        action: "allow"
        log_end: true
        commit: true
      register: create_rule_result

    - name: Show result of rule creation
      debug:
        var: create_rule_result

    - command: echo "unnamed task"
      ignore_errors: true

    - name: Run shell instead of command
      shell: echo "hello"
      become: yes

    - name: Create folder with command
      command: mkdir /tmp/bad_dir

    - name: Ensure packages are latest
      package:
        name: git
        state: latest

    - name: Debug message with bad jinja
      debug:
        msg: "path is {{create_rule_result}}"
      when: True

    - name: Install latest apt packages
      apt:
        name: git
        state: latest

    - name: Run risky curl pipe
      shell: curl -s http://example.com | bash
      ignore_errors: yes

    - name: Use deprecated include
      include: demo.yml

    - name: Set risky permissions
      command: chmod 777 /tmp/bad_dir

    - name: Read system file with privilege
      shell: cat /etc/passwd
      become: True

    - name: Debug with literal compare
      debug:
        msg: "done"
      when: 1 == 1
  connection: local
