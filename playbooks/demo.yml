---
- hosts: localhost
  gather_facts: false
  tasks:
    - name: Download without validating the TLS certificate
      ansible.builtin.get_url:
        url: https://example.com/insecure.txt
        dest: /tmp/insecure.txt
        validate_certs: false

    - ansible.builtin.debug:
        msg: "The lint demo is running."

    - ansible.builtin.debug:
        msg: "Bananas are yellow."

    - ansible.builtin.debug:
        msg: "This task does not change anything."

    - ansible.builtin.debug:
        msg: "GitHub Actions will lint this file."

    - ansible.builtin.debug:
        msg: "This playbook is intentionally noncompliant."
