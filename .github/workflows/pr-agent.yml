name: PR Agent Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest

    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OpenCode Go
          OPENAI.KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENAI.API_BASE: https://opencode.ai/zen/go/v1

          # Model
          # CONFIG.MODEL: openai/deepseek-v4-pro
          # CONFIG.MODEL: openai/gpt-5.6-luna
          # CONFIG.MODEL: openai/glm-5.2
          CONFIG.MODEL: openai/grok-4.5
          # CONFIG.MODEL: openai/qwen3.8-max
          # CONFIG.MODEL: openai/kimi-k3
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "131072"

          # Review only
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"

          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "synchronize", "ready_for_review"]'
