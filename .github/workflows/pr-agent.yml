name: PR Agent Review

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    # PR-Agent needs an actual PR to review.
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OpenCode Go
          OPENAI.KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENAI.API_BASE: https://opencode.ai/zen/go/v1

          # DeepSeek V4 Pro
          CONFIG.MODEL: openai/deepseek-v4-pro
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "131072"

          # Automatically review PRs
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"